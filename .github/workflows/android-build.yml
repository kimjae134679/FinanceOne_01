name: FinanceOne Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-verify-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: APK 빌드
        run: |
          npm ci
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew clean assembleDebug --stacktrace

      - name: Android 가속 권한 설정
        run: sudo chmod 666 /dev/kvm

      - name: 깨끗한 Android에서 APK 설치 검증
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.financeone.mobile
            adb shell dumpsys package com.financeone.mobile | grep -E "versionCode|versionName|firstInstallTime"

      - name: 설치 검증 APK 저장
        uses: actions/upload-artifact@v4
        with:
          name: FinanceOne-v1.6.4-install-verified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
