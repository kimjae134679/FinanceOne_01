name: FinanceOne Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-unsigned-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: Android SDK 구성
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Node 패키지 설치
        run: npm ci

      - name: Capacitor 동기화
        run: npx cap sync android

      - name: Gradle 권한 설정
        run: chmod +x android/gradlew

      - name: Release APK 컴파일
        working-directory: android
        run: ./gradlew clean assembleRelease --stacktrace

      - name: APK 정렬 및 서명 도구 준비
        run: |
          mkdir -p build-output
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" \
            -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            build-output/FinanceOne-Mobile-v1.5.0-unsigned-aligned.apk
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" \
            build-output/apksigner.jar

      - name: 컴파일 결과 저장
        uses: actions/upload-artifact@v4
        with:
          name: FinanceOne-v1.5.0-unsigned
          path: build-output/
          if-no-files-found: error
          retention-days: 30
        
