name: FinanceOne APK Install Diagnostic

on:
  push:
    branches:
      - agent/apk-install-diagnostic

jobs:
  install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 프로젝트 받기
        uses: actions/checkout@v4

      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 깨끗한 Android에서 APK 설치
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r diagnostic/FinanceOne-Mobile-v1.5.0-GoogleDrive.apk
            adb shell pm path com.financeone.mobile
            adb shell dumpsys package com.financeone.mobile | grep -E "versionCode|versionName|firstInstallTime"
